<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>GOURMET NOTE v0.4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f4f1;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:18px 16px 105px}
header{padding:12px 3px 8px}
h1{font-size:27px;margin:0;letter-spacing:.05em}
.sub{color:#777;margin-top:5px;font-size:14px}
.hero{background:#171717;color:#fff;border-radius:22px;padding:20px;margin:14px 0}
.hero b{font-size:21px;display:block;margin-bottom:6px}
.hero p{margin:0;color:#ddd;font-size:14px;line-height:1.55}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.quick button{border:0;background:#fff;border-radius:17px;padding:17px 12px;text-align:left;box-shadow:0 1px 8px #0000000b}
.quick strong{display:block;font-size:16px;margin-top:7px}
.quick small{color:#777}
.tools{position:sticky;top:0;background:#f5f4f1;padding:8px 0 12px;z-index:4}
input,select,button{font:inherit}
.search{width:100%;border:0;background:#fff;border-radius:14px;padding:14px 15px;box-shadow:0 1px 6px #0000000d}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.filters select{min-width:0;border:0;background:#fff;padding:11px 8px;border-radius:12px}
.card{background:#fff;border-radius:19px;padding:16px;margin:11px 0;box-shadow:0 1px 8px #0000000b}
.row{display:flex;justify-content:space-between;gap:10px}
.name{font-size:18px;font-weight:750}
.tag{font-size:12px;background:#eee;border-radius:999px;padding:5px 9px;white-space:nowrap}
.meta{color:#6b6b6b;font-size:14px;margin-top:7px}
.priority{font-weight:750;margin-top:9px}
.actions{display:flex;gap:8px;margin-top:13px}
.actions button,.actions a{border:0;text-decoration:none;text-align:center;background:#eee;color:#111;border-radius:11px;padding:10px;flex:1}
.actions .done{background:#171717;color:#fff}
.visited{opacity:.67}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);background:#fff;border-top:1px solid #e7e7e7;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:8}
.bottom button{border:0;background:transparent;padding:7px 2px;font-size:11px}
.bottom span{display:block;font-size:21px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:16px;overflow:auto}
.panel{max-width:620px;margin:3vh auto;background:#fff;border-radius:22px;padding:20px}
.panel h2{margin-top:0}
.panel input,.panel select,.panel textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;margin:6px 0;font:inherit}
.panel textarea{min-height:80px;resize:vertical}
.buttons{display:flex;gap:8px;margin-top:12px}
.buttons button{flex:1;border:0;padding:12px;border-radius:11px}
.primary{background:#171717!important;color:#fff}
.upload{border:1.5px dashed #bbb;border-radius:17px;padding:18px;text-align:center;margin:10px 0;background:#fafafa}
.upload input{display:none}
.preview{width:100%;max-height:270px;object-fit:contain;border-radius:13px;display:none;margin-top:10px;background:#eee}
.aiBox{background:#f2f2f2;border-radius:15px;padding:14px;margin-top:12px}
.aiBox b{display:block;margin-bottom:5px}
.aiBox p{font-size:13px;color:#666;line-height:1.5;margin:0}
.notice{font-size:12px;color:#777;margin-top:8px;line-height:1.45}
.analyzeBtn{width:100%;border:0;background:#171717;color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px;margin-top:12px}
.analyzeBtn:disabled{opacity:.45}
.aiStatus{display:none;margin-top:12px;background:#f2f2f2;border-radius:15px;padding:14px}
.aiStatus.show{display:block}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #bbb;border-top-color:#171717;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.candidate{display:none;margin-top:12px;border:1px solid #ddd;border-radius:16px;padding:14px;background:#fff}
.candidate.show{display:block}
.candidate .label{font-size:12px;color:#777;margin-bottom:5px}
.candidate .shop{font-size:18px;font-weight:800}
.candidate .candidateMeta{font-size:13px;color:#666;line-height:1.5;margin-top:5px}
.candidateBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.candidateBtns button{border:0;border-radius:12px;padding:12px;font-weight:700}
.candidateBtns .yes{background:#171717;color:#fff}
.candidateBtns .no{background:#eee;color:#171717}
.formStage{display:none;margin-top:12px}
.formStage.show{display:block}
.sceneBox{margin:9px 0 4px}
.sceneLabel{font-size:13px;color:#666;margin-bottom:7px}
.sceneTags{display:flex;flex-wrap:wrap;gap:7px}
.sceneTags label{position:relative}
.sceneTags input{position:absolute;opacity:0;pointer-events:none}
.sceneTags span{display:inline-block;border:1px solid #d7d7d7;background:#fff;border-radius:999px;padding:8px 11px;font-size:13px}
.sceneTags input:checked+span{background:#171717;color:#fff;border-color:#171717}
.sceneView{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sceneView span{font-size:12px;background:#f0eee9;border-radius:999px;padding:5px 8px}
.empty{text-align:center;color:#888;padding:35px}
.sectionTitle{font-size:14px;color:#777;margin:18px 3px 5px}
</style>
</head>
<body>
<div class="app">
<header><h1>GOURMET NOTE</h1><div class="sub">見つけたお店を、スクショから自分のリストへ。</div></header>

<div class="hero">
<b>スクリーンショット登録</b>
<p>Instagram・Web・SNSで気になったお店をスクショから保存。画像解析 → 店舗候補の確認 → ジャンル・利用シーンを選んで登録する流れに対応したv0.4です。</p>
</div>

<div class="quick">
<button onclick="openCapture()"><span style="font-size:25px">📷</span><strong>スクショから登録</strong><small>画像を選んで店舗情報へ</small></button>
<button onclick="openManual()"><span style="font-size:25px">＋</span><strong>手入力で登録</strong><small>店名・地域・ジャンル</small></button>
</div>

<div class="tools">
<input class="search" id="q" placeholder="店名・地域・ジャンルを検索">
<div class="filters">
<select id="status"><option value="">すべて</option><option value="want">行きたい</option><option value="done">訪問済み</option></select>
<select id="genre"><option value="">全ジャンル</option></select>
<select id="area"><option value="">全地域</option></select><select id="scene"><option value="">全利用シーン</option><option>デート</option><option>大衆</option><option>ひとり飲み</option><option>接待</option><option>友人</option><option>家族</option></select>
</div>
</div>

<div class="sectionTitle" id="countText"></div>
<main id="list"></main>
</div>

<nav class="bottom">
<button onclick="resetFilters()"><span>⌂</span>ホーム</button>
<button onclick="showMapInfo()"><span>🗺</span>地図</button>
<button onclick="openCapture()"><span>📷</span>登録</button>
<button onclick="showFavorites()"><span>★</span>★①</button>
</nav>

<div class="modal" id="captureModal">
<div class="panel">
<h2>スクリーンショットから登録</h2>
<div class="upload">
<label for="shot"><strong>画像を選択</strong><br><small>写真ライブラリからスクリーンショットを選びます</small></label>
<input id="shot" type="file" accept="image/*">
<img id="preview" class="preview">
</div>
<button id="analyzeBtn" class="analyzeBtn" onclick="analyzeScreenshot()" disabled>画像を解析</button>
<div id="aiStatus" class="aiStatus"></div>
<div id="candidate" class="candidate">
  <div class="label">認識した店舗候補</div>
  <div id="candidateName" class="shop"></div>
  <div id="candidateMeta" class="candidateMeta"></div>
  <div class="candidateBtns">
    <button class="yes" onclick="acceptCandidate()">この店です</button>
    <button class="no" onclick="rejectCandidate()">違う店を探す</button>
  </div>
</div>
<div id="captureForm" class="formStage">
<input id="cn" placeholder="店名">
<input id="ca" placeholder="地域・エリア">
<select id="cg"><option value="">ジャンルを選択</option>
<option>居酒屋</option>
<option>寿司</option>
<option>和食</option>
<option>魚料理・海鮮</option>
<option>焼肉</option>
<option>牛タン</option>
<option>とんかつ</option>
<option>焼き鳥</option>
<option>ラーメン</option>
<option>そば・うどん</option>
<option>中華</option>
<option>洋食</option>
<option>イタリアン</option>
<option>フレンチ</option>
<option>カレー</option>
<option>カフェ・喫茶店</option>
<option>スイーツ</option>
<option>バー</option>
<option>その他</option></select>
<input id="caddr" placeholder="住所（任意）">
<div class="sceneBox">
  <div class="sceneLabel">利用シーン（任意・複数選択）</div>
  <div class="sceneTags">
    <label><input type="checkbox" name="cscene" value="デート"><span>デート</span></label>
    <label><input type="checkbox" name="cscene" value="大衆"><span>大衆</span></label>
    <label><input type="checkbox" name="cscene" value="ひとり飲み"><span>ひとり飲み</span></label>
    <label><input type="checkbox" name="cscene" value="接待"><span>接待</span></label>
    <label><input type="checkbox" name="cscene" value="友人"><span>友人</span></label>
    <label><input type="checkbox" name="cscene" value="家族"><span>家族</span></label>
  </div>
</div>
<textarea id="cm" placeholder="メモ"></textarea>
<select id="cp"><option>★①</option><option>★②</option><option>★③</option></select>
<div class="notice">※ v0.4は「画像解析 → 候補確認 → 登録」の画面フローまで実装しています。実際の自動認識は次にAI/店舗検索APIを接続すると有効になります。接続前でも「手入力で続ける」で登録できます。</div>
<div class="buttons"><button onclick="closeModal('captureModal')">キャンセル</button><button class="primary" onclick="addCaptured()">登録</button></div>
</div>
</div>
</div>

<div class="modal" id="manualModal">
<div class="panel">
<h2>お店を手入力</h2>
<input id="mn" placeholder="店名">
<input id="ma" placeholder="地域・エリア">
<select id="mg"><option value="">ジャンルを選択</option>
<option>居酒屋</option>
<option>寿司</option>
<option>和食</option>
<option>魚料理・海鮮</option>
<option>焼肉</option>
<option>牛タン</option>
<option>とんかつ</option>
<option>焼き鳥</option>
<option>ラーメン</option>
<option>そば・うどん</option>
<option>中華</option>
<option>洋食</option>
<option>イタリアン</option>
<option>フレンチ</option>
<option>カレー</option>
<option>カフェ・喫茶店</option>
<option>スイーツ</option>
<option>バー</option>
<option>その他</option></select>
<input id="maddr" placeholder="住所（任意）">
<div class="sceneBox">
  <div class="sceneLabel">利用シーン（任意・複数選択）</div>
  <div class="sceneTags">
    <label><input type="checkbox" name="mscene" value="デート"><span>デート</span></label>
    <label><input type="checkbox" name="mscene" value="大衆"><span>大衆</span></label>
    <label><input type="checkbox" name="mscene" value="ひとり飲み"><span>ひとり飲み</span></label>
    <label><input type="checkbox" name="mscene" value="接待"><span>接待</span></label>
    <label><input type="checkbox" name="mscene" value="友人"><span>友人</span></label>
    <label><input type="checkbox" name="mscene" value="家族"><span>家族</span></label>
  </div>
</div>
<textarea id="mm" placeholder="メモ"></textarea>
<select id="mp"><option>★①</option><option>★②</option><option>★③</option></select>
<div class="buttons"><button onclick="closeModal('manualModal')">キャンセル</button><button class="primary" onclick="addManual()">登録</button></div>
</div>
</div>

<div class="modal" id="infoModal">
<div class="panel"><h2 id="infoTitle"></h2><div id="infoBody" class="meta" style="font-size:15px;line-height:1.7"></div><div class="buttons"><button class="primary" onclick="closeModal('infoModal')">閉じる</button></div></div>
</div>

<script>
const seed=[
{name:'文化横丁酒場 賓（まろうど）',area:'文化横丁・一番町',genre:'居酒屋',priority:'★①',memo:'',address:'',status:'want',scenes:[]},
{name:'小判寿司',area:'一番町',genre:'寿司',priority:'★①',memo:'',address:'',status:'want',scenes:[]},
{name:'居酒屋 矢三朗 新寺本店',area:'新寺',genre:'居酒屋・魚料理',priority:'★①',memo:'かつお',address:'',status:'want',scenes:[]},
{name:'牛たん けやき 仙台一番町本店',area:'一番町',genre:'牛タン',priority:'★①',memo:'',address:'',status:'want',scenes:[]},
{name:'居酒屋ちょーちょ',area:'国分町',genre:'居酒屋・魚料理',priority:'★①',memo:'',address:'',status:'want',scenes:[]},
{name:'夜ノ焼魚 ちょーちょむすび',area:'上杉',genre:'焼魚・居酒屋',priority:'★①',memo:'要確認',address:'',status:'want',scenes:[]},
{name:'たんや善治郎',area:'仙台駅前',genre:'牛タン',priority:'★①',memo:'要確認',address:'',status:'want',scenes:[]},
{name:'さぶろう',area:'',genre:'',priority:'★①',memo:'手書きノート・要確認',address:'',status:'want',scenes:[]},
{name:'3.3？',area:'',genre:'',priority:'★①',memo:'手書きノート・要確認',address:'',status:'want',scenes:[]},
{name:'仙台銀？',area:'',genre:'',priority:'★①',memo:'手書きノート・要確認',address:'',status:'want',scenes:[]},
{name:'だん',area:'',genre:'',priority:'★①',memo:'手書きノート・要確認',address:'',status:'want',scenes:[]},
{name:'とんとん亭？',area:'',genre:'とんかつ？',priority:'★①',memo:'手書きノート・要確認',address:'',status:'want',scenes:[]},
{name:'ちょうつがい？',area:'',genre:'',priority:'★①',memo:'手書きノート・要確認',address:'',status:'want',scenes:[]},
{name:'仙八？',area:'',genre:'',priority:'★①',memo:'手書きノート・要確認',address:'',status:'want',scenes:[]},
{name:'このじ？',area:'',genre:'',priority:'★①',memo:'手書きノート・要確認',address:'',status:'want',scenes:[]}
];
let shops=JSON.parse(localStorage.getItem('gourmetnote02')||'null')||seed;
let pendingImage='';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('gourmetnote02',JSON.stringify(shops));render()}
function render(){
 const query=q.value.toLowerCase(),st=status.value,ge=genre.value,ar=area.value,sc=scene.value;
 const genres=[...new Set(shops.map(x=>x.genre).filter(Boolean))].sort();
 const areas=[...new Set(shops.map(x=>x.area).filter(Boolean))].sort();
 let gv=genre.value,av=area.value;
 genre.innerHTML='<option value="">全ジャンル</option>'+genres.map(x=>`<option>${esc(x)}</option>`).join('');
 area.innerHTML='<option value="">全地域</option>'+areas.map(x=>`<option>${esc(x)}</option>`).join('');
 genre.value=gv;area.value=av;
 const arr=shops.filter(x=>(!st||x.status===st)&&(!ge||x.genre===ge)&&(!ar||x.area===ar)&&(!sc||(x.scenes||[]).includes(sc))&&([x.name,x.area,x.genre,x.memo,x.address,(x.scenes||[]).join(' ')].join(' ').toLowerCase().includes(query)));
 countText.textContent=`${arr.length}件表示 ／ 登録 ${shops.length}件`;
 list.innerHTML=arr.length?arr.map(x=>{
   let i=shops.indexOf(x);
   let map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([x.name,x.address,x.area].filter(Boolean).join(' '));
   return `<article class="card ${x.status==='done'?'visited':''}">
   <div class="row"><div class="name">${esc(x.name)}</div><span class="tag">${x.status==='done'?'訪問済み':'行きたい'}</span></div>
   <div class="meta">${esc([x.area,x.genre].filter(Boolean).join(' ・ ')||'情報未設定')}</div>
   ${x.address?`<div class="meta">📍 ${esc(x.address)}</div>`:''}${(x.scenes||[]).length?`<div class="sceneView">${x.scenes.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
   <div class="priority">${esc(x.priority)}</div>
   ${x.memo?`<div class="meta">📝 ${esc(x.memo)}</div>`:''}
   ${x.image?`<img src="${x.image}" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:10px">`:''}
   <div class="actions"><a href="${map}" target="_blank">Googleマップ</a><button class="done" onclick="toggle(${i})">${x.status==='done'?'行きたいへ':'訪問済み'}</button></div>
   </article>`
 }).join(''):'<div class="empty">該当するお店がありません</div>';
}
function openCapture(){captureModal.style.display='block';resetRecognition()}
function openManual(){manualModal.style.display='block'}
function closeModal(id){document.getElementById(id).style.display='none'}
function checkedScenes(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value)}
function clearScenes(name){document.querySelectorAll(`input[name="${name}"]`).forEach(x=>x.checked=false)}

let recognitionCandidate=null;
function resetRecognition(){
 recognitionCandidate=null;
 analyzeBtn.disabled=!pendingImage;
 aiStatus.className='aiStatus';
 aiStatus.innerHTML='';
 candidate.className='candidate';
 candidateName.textContent='';
 candidateMeta.textContent='';
 captureForm.className='formStage';
}
async function analyzeScreenshot(){
  if(!pendingImage){
    alert('先にスクリーンショットを選択してください');
    return;
  }

  aiStatus.className='aiStatus show';
  aiStatus.innerHTML='<span class="spinner"></span>画像をAIで解析しています…';
  candidate.className='candidate';
  captureForm.className='formStage';

  try {
    const response = await fetch(
      'https://gourmet-note-api.hnet0705.workers.dev/',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          image: pendingImage
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || 'AI解析に失敗しました');
    }

    recognitionCandidate = data;

    aiStatus.className='aiStatus';

    candidateName.textContent =
      data.restaurant_name || data.name || '店舗名を特定できませんでした';

    candidateMeta.textContent =
      [data.address, data.category]
        .filter(Boolean)
        .join(' / ');

    candidate.className='candidate show';

  } catch(error) {
    console.error(error);

    aiStatus.className='aiStatus show';
    aiStatus.innerHTML =
      '<b>画像の解析に失敗しました</b><br>' +
      '<span style="font-size:13px;color:#666">' +
      error.message +
      '</span>';
  }
}
function manualAfterAnalysis(){
 aiStatus.className='aiStatus';
 captureForm.className='formStage show';
 setTimeout(()=>cn.focus(),100);
}
function acceptCandidate(){
 if(!recognitionCandidate)return;
 cn.value=recognitionCandidate.name||'';
 ca.value=recognitionCandidate.area||'';
 caddr.value=recognitionCandidate.address||'';
 if(recognitionCandidate.genre) cg.value=recognitionCandidate.genre;
 candidate.className='candidate';
 captureForm.className='formStage show';
}
function rejectCandidate(){
 candidate.className='candidate';
 captureForm.className='formStage show';
 cn.value=''; ca.value=''; caddr.value=''; cg.value='';
 setTimeout(()=>cn.focus(),100);
}

function addCaptured(){
 let name=cn.value.trim(); if(!name){alert('店名を入力してください');return}
 shops.unshift({name,area:ca.value.trim(),genre:cg.value.trim(),address:caddr.value.trim(),memo:cm.value.trim(),priority:cp.value,status:'want',image:pendingImage,scenes:checkedScenes('cscene')});
 ['cn','ca','caddr','cm'].forEach(id=>document.getElementById(id).value='');cg.value='';
 pendingImage='';preview.src='';preview.style.display='none';shot.value='';clearScenes('cscene');resetRecognition();
 closeModal('captureModal');save()
}
function addManual(){
 let name=mn.value.trim();if(!name){alert('店名を入力してください');return}
 shops.unshift({name,area:ma.value.trim(),genre:mg.value.trim(),address:maddr.value.trim(),memo:mm.value.trim(),priority:mp.value,status:'want',scenes:checkedScenes('mscene')});
 ['mn','ma','maddr','mm'].forEach(id=>document.getElementById(id).value='');mg.value='';
 clearScenes('mscene');closeModal('manualModal');save()
}
function toggle(i){shops[i].status=shops[i].status==='done'?'want':'done';save()}
function resetFilters(){q.value='';status.value='';genre.value='';area.value='';scene.value='';render()}
function showFavorites(){q.value='';status.value='';genre.value='';area.value='';scene.value='';render();window.scrollTo({top:document.querySelector('.tools').offsetTop,behavior:'smooth'})}
function showMapInfo(){
 infoTitle.textContent='地図一覧';
 infoBody.innerHTML='各店舗の「Googleマップ」から店舗検索を開けます。登録店舗を1枚の地図上にピン表示する地図一覧は次のアップデートで接続予定です。';
 infoModal.style.display='block'
}
shot.addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{
   pendingImage=ev.target.result;
   preview.src=pendingImage;
   preview.style.display='block';
   resetRecognition();
   analyzeBtn.disabled=false;
 };
 r.readAsDataURL(f)
});
q.oninput=render;status.onchange=render;genre.onchange=render;area.onchange=render;scene.onchange=render;render();
</script>
</body>
</html>
